services:
  # ── Backend: Node.js Express API ───────────────────────────
  - type: web
    name: project-management-backend
    runtime: node
    region: oregon          # closest free region; change to frankfurt for EU
    plan: free              # 750 free hours/month on Render
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Copy all values from backend/.env into Render Dashboard → Environment
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns this automatically; keep as fallback
      - key: POSTGRES_URL
        sync: false           # Set manually in Render Dashboard
      - key: JWT_SECRET
        sync: false           # Set manually in Render Dashboard
      - key: CORS_ORIGIN
        sync: false           # Set to your Vercel frontend URL, e.g. https://yourapp.vercel.app
